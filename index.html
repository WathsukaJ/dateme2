<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Go On A Date With Me?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1 වෙනි Screen එක: ප්‍රශ්නය -->
    <div class="card" id="card1">
        <img id="gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z2Y3R6OHpjc3Rtd3N4cnZwZHJ6Y3RmdWZ2Y2R6eGZ6M2V6eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L8KEO929o1yLneB19f/giphy.gif" alt="Cute GIF">
        <h1>Will you go on a date with me? 💖</h1>
        <div class="btn-group">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <!-- 2 වෙනි Screen එක: Yes කිව්වම එන Reaction එක -->
    <div class="card hidden" id="card2">
        <div class="icon-box">🧽</div>
        <h1 class="heading-large">WAIT YOU ACTUALLY SAID YES?? 😭</h1>
        <p class="subtitle">I was so ready for you to say no 😅</p>
        <button id="nextBtn1" class="action-btn">okay okay! →</button>
    </div>

    <!-- 3 වෙනි Screen එක: Date, Time & Place Form එක -->
    <div class="card hidden" id="card3">
        <div class="header-icon">📅🐾</div>
        <h1 class="heading-large">So... when are you free?</h1>
        
        <form id="dateForm" action="https://formspree.io/f/mojgpzly" method="POST">
            <div class="input-group">
                <label>Pick a Day 📅</label>
                <input type="date" name="Date" id="dateInput" required>
            </div>

            <div class="input-group">
                <label>What Time? ⏰</label>
                <input type="time" name="Time" id="timeInput" required>
            </div>

            <div class="input-group">
                <label>Where should we go? 📍</label>
                <input type="text" name="Place" id="placeInput" placeholder="Type a place or restaurant..." required>
            </div>

            <button type="submit" class="action-btn full-width">set the date! ♥</button>
        </form>
    </div>

    <!-- 4 වෙනි Screen එක: Final Pickup Message එක -->
    <div class="card hidden" id="card4">
        <div class="header-icon">🎉💖</div>
        <h1 class="heading-large">It's a Date!</h1>
        <p class="subtitle" id="finalDetails"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
